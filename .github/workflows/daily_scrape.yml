name: Daily Scraper

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 수집 스크립트 실행
        run: python collector.py

      - name: 수집된 데이터 GitHub 저장소에 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Auto collect daily schedule data [$(date +'%Y-%m-%d')]" || exit 0
          git push
