name: Daily Scraper

on:
  schedule:
    # 매일 한국 시간 기준 오전 9시 (UTC 기준 00:00)에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동으로 실행 버튼(Run workflow) 누를 수 있게 허용

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: TLS 차단 우회 및 데이터 처리 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi pandas

      - name: 수집 스크립트(collector.py) 실행
        run: python collector.py

      - name: 수집된 CSV 데이터 저장소에 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Auto collect daily schedule data [$(date +'%Y-%m-%d')]" || exit 0
          git push
